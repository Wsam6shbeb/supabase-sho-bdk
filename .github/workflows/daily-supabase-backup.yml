name: Daily Supabase Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "35 2 * * *" # Daily at 02:35 UTC

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17 openssl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Drive client libraries
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Create encrypted backup and upload to Google Drive
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: python scripts/backup_supabase_to_drive.py
