name: Security Edge Function tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - security/launch-hardening

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Edge Function tests
        run: deno test --no-lock --config supabase/functions/_tests/deno.json -A supabase/functions/_tests/
