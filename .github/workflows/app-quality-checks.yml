name: App quality checks

on:
  push:
    branches:
      - fix/app-double-tap-protection
      - معالجة-الأخطاء
  pull_request:
    branches:
      - main

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Jest tests
        run: npm test -- --runInBand
      - name: Check app TypeScript
        run: npx tsc --noEmit --project tsconfig.app.json
